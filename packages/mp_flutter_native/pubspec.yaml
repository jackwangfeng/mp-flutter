name: mp_flutter_native
description: >-
  在 mp-flutter 编译的微信小程序里,把 MpVideo/MpMap/MpCamera 接到原生
  <video>/<map>/<camera> 组件(Task 2 的 JS 同步层);其它平台/普通浏览器
  上渲染 fallback。
version: 0.2.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 仅供 test/registry_web_browser_test.dart 用(`@TestOn('browser')`,靠
  # `dart test -p chrome` 跑,不是 `flutter test`)——`flutter_test` 没有
  # `@TestOn`/浏览器平台选择这一套,镜像 mp_flutter_wechat 的做法。
  test: ^1.25.0
