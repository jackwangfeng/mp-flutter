name: mp_flutter_native
description: Wire MpVideo/MpMap/MpCamera to native <video>/<map>/<camera> in WeChat Mini Programs built by flutter_miniprogram; falls back elsewhere.
version: 0.3.0
homepage: https://github.com/jackwangfeng/mp-flutter
repository: https://github.com/jackwangfeng/mp-flutter/tree/main/packages/mp_flutter_native
issue_tracker: https://github.com/jackwangfeng/mp-flutter/issues
topics:
  - wechat
  - miniprogram
  - flutter-web
  - cross-platform

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 仅供 test/registry_web_browser_test.dart 用(`@TestOn('browser')`,靠
  # `dart test -p chrome` 跑,不是 `flutter test`)——`flutter_test` 没有
  # `@TestOn`/浏览器平台选择这一套,镜像 mp_flutter_wechat 的做法。
  test: ^1.25.0
