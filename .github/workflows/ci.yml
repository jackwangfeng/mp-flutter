name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.9', '3.47.4']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 与 lib/src/esbuild_resolver.dart 的 kEsbuildVersion 保持一致。
      # 语法降级单测禁止自动安装,必须在运行测试前准备真实二进制。
      - name: 安装 esbuild
        run: npm install --global esbuild@0.28.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: 'stable'

      - name: 安装 brotli(I2/M11:canvaskit.wasm 压缩依赖,ubuntu-latest 不预装)
        run: sudo apt-get install -y brotli

      - name: tools/ci/check.sh
        run: tools/ci/check.sh
